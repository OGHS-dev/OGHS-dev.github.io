<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap" rel="stylesheet">

    <title>Diane with an E</title>
</head>
<style>
  body {
    min-height: 100vh;
    background-image: url('parthenon.jpg');
    background-size: cover;
    background-position: center;
    background-attachment: fixed;
    color: white;
  }

  .glass-card {
    background-color: rgba(255, 255, 255, 0.15);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    border: 1px solid rgba(255, 255, 255, 0.35);
  }

  .carousel-item img {
    width: 100%;
    height: auto;
    max-height: 340px;
    object-fit: cover;
    border-radius: 0.5rem;
  }
</style>
<body>

                    </div>
                    <div class="carousel-item" data-bs-interval="10000">

                            <p>Slide 3: </p>
                        </div>
                    </div>
                    <div class="carousel-item" data-bs-interval="10000">
                        <img src="4.JPG" class="d-block w-100" alt="Slide 4">
                        <div class="carousel-caption d-none d-md-block">
                            <p>Slide 4: </p>
                        </div>
                    </div>
                    <div class="carousel-item" data-bs-interval="10000">
                        <img src="5.JPG" class="d-block w-100" alt="Slide 5">
                        <div class="carousel-caption d-none d-md-block">

                        </div>
                    </div>
                    <div class="carousel-item" data-bs-interval="10000">
                        <img src="6.JPG" class="d-block w-100" alt="Slide 6">
                        <div class="carousel-caption d-none d-md-block">
                            <p>Slide 6: </p>
                        </div>
                    </div>
                    <div class="carousel-item" data-bs-interval="10000">
                        <img src="7.JPG" class="d-block w-100" alt="Slide 7">
                        <div class="carousel-caption d-none d-md-block">
                            <p>Slide 7: </p>
                        </div>
                    </div>
                    <div class="carousel-item" data-bs-interval="10000">
                        <img src="8.JPG" class="d-block w-100" alt="Slide 8">
                        <div class="carousel-caption d-none d-md-block">

                    </div>
                </div>

                <button class="carousel-control-prev" type="button" data-bs-target="#dianaCarousel"
                    data-bs-slide="prev">
                    <span class="carousel-control-prev-icon" aria-hidden="true"></span>
                    <span class="visually-hidden">Previous</span>
                </button>
                <button class="carousel-control-next" type="button" data-bs-target="#dianaCarousel"
                    data-bs-slide="next">
                    <span class="carousel-control-next-icon" aria-hidden="true"></span>
                    <span class="visually-hidden">Next</span>
                </button>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-ENjdO4Dr2bkBIFxQpeoWtXfQhpSF5+e4BvZlZ6g6mCWGzvI1xVqB6YkGtQ3vsl5K"
        crossorigin="anonymous"></script>
    <script>
      document.addEventListener('DOMContentLoaded', function() {
        const carouselEl = document.getElementById('dianaCarousel');
        if (carouselEl && window.bootstrap && bootstrap.Carousel) {
          const carousel = new bootstrap.Carousel(carouselEl, {
            interval: 4500,
            wrap: true,
            ride: 'carousel'
          });

          const prev = carouselEl.querySelector('.carousel-control-prev');
          const next = carouselEl.querySelector('.carousel-control-next');

          if (prev) prev.addEventListener('click', function(e) {
            e.preventDefault();
            carousel.prev();
          });

          if (next) next.addEventListener('click', function(e) {
            e.preventDefault();
            carousel.next();
          });
        }
      });
    </script>
    <!-- existing custom JS can remain here -->
</body>
</html>
